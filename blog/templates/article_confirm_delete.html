{% extends 'base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container mt-5">
    <title>Удалить статью</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <div class="container mt-5">
        <h1 class="mb-4">Удалить статью блога</h1>
        <p>Вы уверены, что хотите удалить "{{ article.name }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'blog:article_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
