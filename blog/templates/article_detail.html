{% extends 'base.html' %}

{% block title %}Статья{% endblock %}

{% block content %}
<div class="container" style="margin-bottom: 70px;">
    <h1>Статья блога</h1>
</div>

<div class="container">
    <div class="card">
        <div class="card-body">
            {% if article.image %}
                <img src="{{ article.image.url }}" class="img-fluid" alt="{{ article.name }}" style="width: 100%; max-height: 400px; object-fit: contain; margin-bottom: 15px;">
            {% else %}
                <img src="https://via.placeholder.com/800x400?text=Нет+фото" class="img-fluid" alt="Нет фото" style="width: 100%; max-height: 400px; object-fit: contain; margin-bottom: 15px;">
            {% endif %}
            <h5 class="card-title">{{ article.name }}</h5>
        </div>

        <div class="card-body" style="min-height: 50vh; overflow-y: auto; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd;">
            <p class="card-text">{{ article.content|default:"Статья отсутствует" }}</p>
        </div>

       <div class="card-body d-flex gap-2">
            <a href="{% url 'blog:article_list' %}" class="btn btn-primary">Назад</a>
            <a href="{% url 'blog:article_update' article.pk %}" class="btn btn-warning">Изменить</a>
            <a href="{% url 'blog:article_delete' article.pk %}" class="btn btn-danger">Удалить</a>
</div>

    </div>
</div>
{% endblock %}
