{% extends 'base.html' %}

{% block title %}Добавление новой статьи{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Добавить новую статью</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'blog:article_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
