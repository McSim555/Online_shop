{% extends 'base.html' %}

{% block title %}Добавление нового товара{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Добавить новый товар</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'catalog:products_info' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
